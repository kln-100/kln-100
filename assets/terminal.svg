<svg xmlns="http://www.w3.org/2000/svg" width="820" height="250" viewBox="0 0 820 250" xml:space="preserve" role="img" aria-label="Terminal: whoami k100, focus cloud security, SIEM, web dev">
  <style>
    text { font-family: 'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace; font-size: 17px; }
    .p { fill: #e1122d; font-weight: 700; }
    .c { fill: #ffffff; }
    .o { fill: #9a9aa2; }
    .a { fill: #e1122d; }
  </style>

  <rect width="820" height="250" rx="12" fill="#040406" stroke="#2a0710" stroke-width="2"/>
  <rect width="820" height="38" rx="12" fill="#0d0d11"/>
  <rect y="26" width="820" height="12" fill="#0d0d11"/>
  <circle cx="24" cy="19" r="6" fill="#e1122d"/>
  <circle cx="44" cy="19" r="6" fill="#5a0b18"/>
  <circle cx="64" cy="19" r="6" fill="#2a0710"/>
  <text x="410" y="24" text-anchor="middle" class="o" style="font-size:13px">k100@sec: ~</text>

  <defs>
    <!-- Each line is revealed by growing its clip rect; durations chain so it reads like typing. -->
    <clipPath id="l1"><rect x="0" y="50" height="30" width="0"><animate attributeName="width" from="0" to="820" begin="0.3s" dur="0.9s" fill="freeze"/></rect></clipPath>
    <clipPath id="l2"><rect x="0" y="80" height="30" width="0"><animate attributeName="width" from="0" to="820" begin="1.3s" dur="0.1s" fill="freeze"/></rect></clipPath>
    <clipPath id="l3"><rect x="0" y="110" height="30" width="0"><animate attributeName="width" from="0" to="820" begin="1.8s" dur="1.1s" fill="freeze"/></rect></clipPath>
    <clipPath id="l4"><rect x="0" y="140" height="30" width="0"><animate attributeName="width" from="0" to="820" begin="3.0s" dur="0.1s" fill="freeze"/></rect></clipPath>
    <clipPath id="l5"><rect x="0" y="170" height="30" width="0"><animate attributeName="width" from="0" to="820" begin="3.5s" dur="1.0s" fill="freeze"/></rect></clipPath>
    <clipPath id="l6"><rect x="0" y="200" height="30" width="0"><animate attributeName="width" from="0" to="820" begin="4.6s" dur="0.1s" fill="freeze"/></rect></clipPath>
  </defs>

  <g clip-path="url(#l1)"><text x="24" y="72"><tspan class="p">$</tspan><tspan class="c"> whoami</tspan></text></g>
  <g clip-path="url(#l2)"><text x="24" y="102" class="o">k100 — security &amp; web developer</text></g>

  <g clip-path="url(#l3)"><text x="24" y="132"><tspan class="p">$</tspan><tspan class="c"> cat focus.txt</tspan></text></g>
  <g clip-path="url(#l4)"><text x="24" y="162"><tspan class="o">[</tspan><tspan class="a">cloud security</tspan><tspan class="o">]  [</tspan><tspan class="a">siem</tspan><tspan class="o">]  [</tspan><tspan class="a">web dev</tspan><tspan class="o">]</tspan></text></g>

  <g clip-path="url(#l5)"><text x="24" y="192"><tspan class="p">$</tspan><tspan class="c"> systemctl status k100</tspan></text></g>
  <g clip-path="url(#l6)"><text x="24" y="222"><tspan class="a">●</tspan><tspan class="o"> active (monitoring) — </tspan><tspan class="c">building, logging, detecting</tspan></text></g>

</svg>
